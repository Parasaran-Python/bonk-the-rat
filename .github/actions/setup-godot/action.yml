name: "Setup Godot Engine"
description: "Downloads and caches Godot Engine binary and export templates"
inputs:
  version:
    description: "Godot version string"
    required: false
    default: "4.6.1-stable"
  templates:
    description: "Whether to install export templates"
    required: false
    default: "true"

runs:
  using: "composite"
  steps:
    - name: Cache Godot binary and templates
      id: cache-godot
      uses: actions/cache@v4
      with:
        path: |
          ~/.local/bin/godot
          ~/.local/share/godot/export_templates
        key: godot-${{ inputs.version }}-${{ inputs.templates }}-v1

    - name: Download and install Godot Engine
      if: steps.cache-godot.outputs.cache-hit != 'true'
      shell: bash
      run: |
        mkdir -p ~/.local/bin
        curl -sSL -o /tmp/godot.zip "https://github.com/godotengine/godot/releases/download/${{ inputs.version }}/Godot_v${{ inputs.version }}_linux.x86_64.zip"
        unzip -q /tmp/godot.zip -d ~/.local/bin
        mv ~/.local/bin/Godot_v${{ inputs.version }}_linux.x86_64 ~/.local/bin/godot
        chmod +x ~/.local/bin/godot
        rm /tmp/godot.zip

        if [ "${{ inputs.templates }}" = "true" ]; then
          TPL_DIR=$(echo "${{ inputs.version }}" | sed 's/-stable/.stable/')
          mkdir -p ~/.local/share/godot/export_templates/${TPL_DIR}
          curl -sSL -o /tmp/templates.tpz "https://github.com/godotengine/godot/releases/download/${{ inputs.version }}/Godot_v${{ inputs.version }}_export_templates.tpz"
          unzip -q /tmp/templates.tpz -d /tmp/tpl_extract
          mv /tmp/tpl_extract/templates/* ~/.local/share/godot/export_templates/${TPL_DIR}/
          rm -rf /tmp/templates.tpz /tmp/tpl_extract
        fi

    - name: Add Godot to PATH
      shell: bash
      run: echo "$HOME/.local/bin" >> $GITHUB_PATH
